# Root-level Alembic config. Everything path-ish is anchored to %(here)s (the
# directory containing THIS file), never to the process CWD, so `alembic ...`
# behaves identically from any directory.
#
# NOTE: there is deliberately no `sqlalchemy.url` key. The URL comes from
# DATABASE_URL via warehouse/config.py. ConfigParser %-interpolates its values,
# so a password containing '%' would explode or silently mangle - and
# config.set_main_option() has the same hazard on the way back out. Building the
# Engine in env.py sidesteps the whole class of bug.

[alembic]
script_location = %(here)s/warehouse/migrations
prepend_sys_path = %(here)s
path_separator = os

# Default file_template is %%(rev)s_%%(slug)s, which with hand-assigned
# --rev-id values yields 0001_customer.py, 0002_menu_item.py, ...
# No date prefix: dates record when someone typed, not dependency order.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
