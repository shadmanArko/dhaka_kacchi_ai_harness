# VPS Docker Compose stack for Dhaka Kacchi's backend + database. One
# Postgres instance with two databases (see postgres-init/01-init-databases.sh),
# the ordering backend, the warehouse (never auto-started - see its
# `profiles` below), and Caddy for automatic HTTPS.
#
# See CLAUDE.md in this directory for how to run and maintain this stack,
# and ARCHITECTURE.md for why it's shaped this way.
#
# Assumes both repos are checked out as siblings on the VPS:
#   /opt/dhaka-kacchi/dhaka_kacchi_ai_harness   (this repo - run `docker
#                                                 compose` from here, in
#                                                 deploy/)
#   /opt/dhaka-kacchi/dhaka-kacchi-connect      (the ordering site + backend)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      ORDERING_APP_PASSWORD: ${ORDERING_APP_PASSWORD:?set in .env}
      WAREHOUSE_APP_PASSWORD: ${WAREHOUSE_APP_PASSWORD:?set in .env}
      ORDERING_READER_PASSWORD: ${ORDERING_READER_PASSWORD:?set in .env}
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:?set in .env}
      WAREHOUSE_COCKPIT_WRITER_PASSWORD: ${WAREHOUSE_COCKPIT_WRITER_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only read on first init against an EMPTY data volume - the official
      # postgres image never re-runs these against existing data. Re-running
      # postgres-init/01-init-databases.sh by hand needs a fresh volume, or a
      # manual `psql` session.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only - never exposed publicly. Debug via an SSH tunnel:
      #   ssh -L 5432:127.0.0.1:5432 <vps-user>@<vps-host>
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dhaka-kacchi]

  ordering-backend:
    build:
      context: ../../dhaka-kacchi-connect/worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ordering_app:${ORDERING_APP_PASSWORD}@postgres:5432/ordering?sslmode=disable
      # Read-only cross-repo connection into THIS repo's warehouse database,
      # as warehouse_reader (never warehouse_app) - powers the admin
      # reporting page only. See that repo's worker/src/lib/
      # reportingRepository.ts and this repo's postgres-init/
      # 01-init-databases.sh for the role this connects as.
      WAREHOUSE_DATABASE_URL: postgresql://warehouse_reader:${WAREHOUSE_READER_PASSWORD}@postgres:5432/warehouse?sslmode=disable
      # A THIRD, narrower cross-repo connection - SELECT+UPDATE-only on
      # cockpit_alert, used only by the admin cockpit page's acknowledge/
      # resolve actions (worker/src/lib/cockpitRepository.ts). Deliberately
      # separate from WAREHOUSE_DATABASE_URL above rather than widening that
      # role's grants - see postgres-init/01-init-databases.sh's header.
      WAREHOUSE_COCKPIT_DATABASE_URL: postgresql://warehouse_cockpit_writer:${WAREHOUSE_COCKPIT_WRITER_PASSWORD}@postgres:5432/warehouse?sslmode=disable
      # Internal-only post-engagement predictor (ml/00-problem-framing through
      # ml/05-production in this repo) - reached over the docker network only,
      # never exposed publicly. See dhaka-kacchi-connect's own admin route
      # that proxies to this.
      PREDICTOR_URL: http://predictor:8000
    depends_on:
      postgres:
        condition: service_healthy
      predictor:
        condition: service_healthy
    networks: [dhaka-kacchi]

  # Serves ml/05-production's trained model (see that directory's report.md
  # and handoff.json for how it was chosen). Built from a baked-in model
  # artifact + the exact feature code used in training - see predictor/
  # Dockerfile for how those get into the image. No ports published: this is
  # reached only by ordering-backend, over PREDICTOR_URL above.
  predictor:
    build:
      context: ..
      dockerfile: predictor/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [dhaka-kacchi]

  # Never started by `docker compose up` - `profiles: [cron]` means it's
  # skipped entirely unless a profile is explicitly requested, which nothing
  # here does. Always invoked directly, e.g.:
  #   docker compose run --rm warehouse uv run alembic upgrade head
  #   docker compose run --rm warehouse make ingest-direct
  warehouse:
    build:
      context: ..
    profiles: ["cron"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://warehouse_app:${WAREHOUSE_APP_PASSWORD}@postgres:5432/warehouse?sslmode=disable
      ORDERING_DATABASE_URL: postgresql://ordering_reader:${ORDERING_READER_PASSWORD}@postgres:5432/ordering?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [dhaka-kacchi]

  # The only service publishing 80/443 - obtains and renews Let's Encrypt
  # certificates automatically, no certbot/cron to babysit.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ordering-backend
    networks: [dhaka-kacchi]

networks:
  dhaka-kacchi:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
